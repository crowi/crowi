packages:
  - "apps/*"
  - "packages/*"

# Default catalog (pnpm 9+). Single source of truth for deps where drift
# across packages would be a bug, not a choice — shared dev tools,
# cross-cutting external peers, and deps whose version defines a shared
# contract (e.g. lucide-react icon names). Per-package runtime deps (next /
# react / mongoose / express / @aws-sdk/* etc.) stay out of the catalog —
# for those, drift per package is intentional.
catalog:
  typescript: ^5.8.3
  tsup: ^8.3.5
  "@types/node": ^24
  jest: ^29.7.0
  "@types/jest": ^29.5.14
  jest-environment-node: ^29.7.0
  ts-jest: ^29.3.4
  zod: ^4.4.3
  "@modelcontextprotocol/sdk": ^1.29.0
  "@hono/mcp": ^0.3.0
  hono-rate-limiter: ^0.5.3
  lucide-react: ^1.35.0
