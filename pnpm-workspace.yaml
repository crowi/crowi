packages:
  - "apps/*"
  - "packages/*"

# Default catalog (pnpm 9+). Single source of truth for deps where drift
# across packages would be a bug, not a choice — shared dev tools,
# cross-cutting external peers, and deps whose version defines a shared
# contract (e.g. lucide-react icon names). Per-package runtime deps (next /
# react / mongoose / express / @aws-sdk/* etc.) stay out of the catalog —
# for those, drift per package is intentional.
catalog:
  typescript: ^6.0.3
  tsup: ^8.3.5
  "@types/node": ^24
  jest: ^30.5.0
  "@types/jest": ^30.0.0
  jest-environment-node: ^30.5.0
  ts-jest: ^29.4.12
  zod: ^4.6.7
  "@typescript-eslint/eslint-plugin": 8.71.1
  "@typescript-eslint/parser": 8.71.1
  typescript-eslint: 8.71.1
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  "@next/eslint-plugin-next": 16.4.3
  eslint-plugin-react-hooks: 7.1.1
  "@eslint-react/eslint-plugin": 5.26.0
  globals: 16.4.0
  "@modelcontextprotocol/sdk": ^1.32.1
  "@hono/mcp": ^0.3.0
  hono-rate-limiter: ^0.5.3
  lucide-react: ^1.35.0
