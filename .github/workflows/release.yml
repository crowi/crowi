name: Release

# Manual-trigger-only while v2 is in active 0.x-dev development.
# Switch to `push: branches: [main]` when the first real publish
# (2.0.0-alpha1 or similar) is ready — at that point also:
#   1. Set NPM_TOKEN secret (Automation Token or OIDC trusted publisher)
#   2. Enable "Allow GitHub Actions to create and approve PRs" in repo settings
#   3. Bump versions out of -dev via a `pnpm changeset version` Version PR
#   4. Configure npm org @crowi provenance if desired
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
