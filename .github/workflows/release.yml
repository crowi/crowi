name: Release

# Trigger: push to main runs changesets/action. When unreleased changesets are
# present it (re)opens a "Version PR"; merging that PR (the human GO gate) lands
# the version bumps on main, which re-runs this workflow and publishes to npm.
# workflow_dispatch is kept for manual re-runs / recovery.
#
# Auth: npm publish uses OIDC Trusted Publishing — NO long-lived NPM_TOKEN.
#   - `id-token: write` (below) lets the runner mint the OIDC token.
#   - `pnpm changeset publish` runs `pnpm publish` per package, which delegates
#     to the bundled npm CLI; npm CLI >=11.5.1 on Node >=22.14.0 performs the
#     OIDC trusted-publishing exchange. Node 24.x here ships a new-enough npm,
#     and pnpm/action-setup@v6 (>=6.0.6) avoids the pnpm-side OIDC regression.
#   - One-time external setup (see operations/release-runbook.mdx): each public
#     @crowi/* package must have a Trusted Publisher configured on npmjs.com
#     (repo crowi/crowi + workflow file release.yml).
#   - NPM_CONFIG_PROVENANCE: 'true' attaches build provenance attestations.
#
# Version PR auth: the PR is opened and pushed with an installation token of
# the org's bot GitHub App (org secrets BOT_CLIENT_ID / BOT_PRIVATE_KEY), not
# GITHUB_TOKEN. A pull_request run started by a GITHUB_TOKEN push waits for a
# manual "approve workflow run", so CI on the Version PR never started on its
# own. The App needs Contents and Pull requests write on crowi/crowi.
#
# changesets/action writes the token it is given to ~/.netrc, and git pushes
# with it — unless checkout left its own token in the git config, which git
# sends first. So checkout keeps no credentials, and the App token is minted
# right before changesets/action (installation tokens last one hour; the
# install and build steps before it would otherwise eat into that). Every
# later push in this job goes through the same .netrc, so the tags it pushes
# (changesets' per-package tags and the distribution tag) go out with the App
# token too and DO start `on: push: tags` workflows (only
# docker-elasticsearch's `es-v*` exists today, which no release tag matches).
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is left with what the aggregate release step needs; the PR
    # and every push go through the App token.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Fail the release BEFORE `changeset publish` if any publishable package
      # lacks the repository metadata npm provenance requires. Otherwise a single
      # offender (e.g. a brand-new plugin) aborts publish mid-way, leaving a
      # partial release (some packages on npm, no Docker, no tags).
      - name: Check publishable package metadata
        run: pnpm check:packages

      # Do NOT add `--tag` here while `.changeset/pre.json` has `mode: "pre"`:
      # `changeset publish` rejects any explicit tag in pre mode outright
      # ("Releasing under custom tag is not allowed in pre mode",
      # `@changesets/cli@2.31.0`), before it reaches the per-package tag logic,
      # so the whole release aborts — no publish, and the dist tag, aggregate
      # release and Docker steps never run because `published` stays false.
      #
      # Which dist tag each package gets is therefore decided by changesets:
      # in pre mode a package goes to the pre tag unless every one of its
      # published versions is a prerelease carrying that same tag, in which
      # case it goes to `latest`. Twenty of the twenty-one land on `latest`
      # that way. `@crowi/plugin-slack` does not, because a hand-published
      # `0.1.0-dev` predates its alphas, so its releases go to `alpha` and its
      # `latest` has to be moved by hand after any release that publishes it
      # (see operations/release-runbook.mdx). Leaving pre mode resolves it.
      # Pinned to v1: the action's v2 line requires Changesets CLI v3 and refuses
      # to run against the CLI v2 this repo uses ("Changesets CLI v2 is not
      # supported; use Changesets action v1 instead"). v2 also renames every
      # input below (publish/version/commit/title -> publish-script/
      # version-script/commit-message/pr-title), so moving up means migrating
      # the CLI and the inputs in one change, not bumping this line.
      - name: Create bot App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: 'true'

      # --- Distribution (umbrella) version tag --------------------------------
      # Only after a real publish (changesets/action sets published=true when it
      # actually published packages; it is false for Version-PR-only runs).
      #
      # The Crowi DISTRIBUTION version is independent of any single npm package
      # (D3): the Docker full/slim image bundles every @crowi/*, so it must get a
      # fresh version on EVERY release — even a plugin-only patch where api/web do
      # not bump. compute-dist-version.mjs derives the base (major.minor + pre
      # channel) from the just-published linked product version and bumps the
      # counter past the max existing `v<base>.*` git tag (candidate (i)).
      - name: Compute distribution version
        if: steps.changesets.outputs.published == 'true'
        id: dist
        run: node scripts/compute-dist-version.mjs --out dist-version.txt

      # Seam to the Docker workflow (docker.yml, phase-3). docker.yml is
      # triggered by `workflow_run` (this Release workflow completing), NOT by
      # this tag push: it reads the version from the artifact uploaded below,
      # and that artifact only exists when a publish happened. This tag is
      # pushed with the App token (see the header), so a `v*` tag trigger
      # added to any workflow would fire here too — docker.yml must not grow
      # one, or every release builds twice. The tag is the durable release
      # record; docker.yml can fall back to the latest `v*` tag.
      - name: Create and push distribution tag
        if: steps.changesets.outputs.published == 'true'
        env:
          DIST_VERSION: ${{ steps.dist.outputs.dist-version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$DIST_VERSION"
          git push origin "$DIST_VERSION"

      # changesets/action publishes a per-package GitHub Release for every
      # @crowi/* that bumped, useful for bisecting a single package — but it
      # is NOT the operator-facing view ("what is in v2.0.0-alpha.X?"). The
      # umbrella distribution tag (above) gets its own Release here, with a
      # body that aggregates the just-published per-package CHANGELOG entries
      # grouped by category. fetch-depth: 0 on checkout above ensures the
      # script can see every previous v* tag for the diff range.
      - name: Create aggregate distribution release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_VERSION: ${{ steps.dist.outputs.dist-version }}
        run: |
          node scripts/aggregate-release-notes.mjs --dist-version "$DIST_VERSION" > release-notes.md
          # semver: a dist tag whose version core has a `-` is a prerelease
          # (v2.0.0-alpha.X / v2.0.0-beta.X / v2.0.0-rc.X). Stable tags
          # (v2.0.0, v2.1.0, …) get `--latest` instead so the GitHub repo page
          # promotes them.
          if [[ "$DIST_VERSION" == *-* ]]; then PRE_FLAG=--prerelease; else PRE_FLAG=--latest; fi
          gh release create "$DIST_VERSION" \
            --title "Crowi $DIST_VERSION" \
            --notes-file release-notes.md \
            "$PRE_FLAG"

      # Hand the distribution version to docker.yml (phase-3) two ways:
      #   (a) as a step output (steps.dist.outputs.dist-version), and
      #   (b) as an artifact, which a workflow_run-triggered docker.yml can
      #       download from this (the triggering) run.
      - name: Upload distribution version artifact
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist-version
          path: dist-version.txt
          if-no-files-found: error
