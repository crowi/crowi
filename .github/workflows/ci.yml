name: CI

on:
  push:
    branches: [main, dev, dev2-2]
    # Skip the code-validating pipeline (test / lint / changeset-status) when a
    # push touches ONLY non-code paths. A mixed code+docs change still runs CI
    # (paths-ignore skips only when EVERY changed file matches). ci.yml itself is
    # deliberately not listed so CI-config changes still get validated.
    paths-ignore: &ci-skip
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - 'apps/crowi-site/**' # validated by its own Cloudflare Pages deploy
      - '.changeset/**'
      - '.claude/**'
      - '.github/workflows/docker.yml'
      - '.github/workflows/docker-elasticsearch.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, dev, dev2-2]
    paths-ignore: *ci-skip

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      # The api test harness (`packages/api/src/test/crowi-environment.js`)
      # picks up `MONGO_URI` and connects to this service, giving each
      # jest worker its own per-file database. Memory-server is used as
      # a local fallback only — CI uses the real binary so we don't
      # depend on every CI runner being able to download a mongo
      # binary on cold cache misses (the historic CI failure mode).
      #
      # Anchored (`&api-test-mongo-service`) so the `flake-report` job below
      # can alias the exact same service instead of drifting out of sync —
      # it spawns @crowi/api's jest directly and needs the identical mongo.
      mongo: &api-test-mongo-service
        image: mongo:8.0.4
        ports:
          - 27017:27017
        # `--healthcheck` keeps the job from racing the mongo boot.
        # actions/services blocks the workflow until the container is
        # healthy when health is configured, so jest never sees a
        # "connection refused" on the first test file.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Anchored (`&api-test-env`) so `flake-report` below can alias the same
    # env instead of duplicating it — see that job's comment for why it needs
    # to match exactly.
    env: &api-test-env
      NODE_ENV: test
      PASSWORD_SEED: test_password_seed
      # `mongo` service is reachable on localhost (the runner publishes
      # the port). Per-test-file db names are generated by the harness.
      MONGO_URI: mongodb://localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run root scripts/ tests
        # Not part of any turbo package (scripts/ isn't a workspace package), so
        # `pnpm test` (turbo run test) doesn't reach it — run separately.
        run: pnpm test:scripts

      - name: Build project
        run: pnpm build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

      - name: Check code formatting
        run: |
          pnpm format
          if [ -n "$(git diff --name-only)" ]; then
            echo "Code is not properly formatted. Please run 'pnpm format' and commit the changes."
            git diff
            exit 1
          fi

  flake-report:
    # Non-blocking flake detector for @crowi/api's full suite
    # (feature-test-parallel-db-flake-hardening, Phase 4 / B2): runs the full
    # suite once, solo-reruns whatever didn't pass, and classifies each as
    # FLAKY (green alone) or REGRESSION (fails alone too) — see
    # `scripts/test-flake-report.mjs`. Mirrors `changeset-status`'s
    # `continue-on-error: true` NON-BLOCKING position below, but — unlike
    # that job — needs the SAME `services`/`env` as the `test` job above:
    # `scripts/test-flake-report.mjs` spawns @crowi/api's real jest suite
    # directly (bypassing turbo), so without `services.mongo` + `MONGO_URI`,
    # `crowi-environment.js`'s CI fail-fast throws for every test file, and
    # both the full-suite run and every solo rerun fail identically —
    # misclassifying every single file as REGRESSION.
    runs-on: ubuntu-latest

    services:
      mongo: *api-test-mongo-service

    env: *api-test-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # `scripts/test-flake-report.mjs` spawns `@crowi/api`'s jest DIRECTLY
        # (bypassing turbo — see that script's doc comment), so it doesn't
        # benefit from turbo's own `test` task `dependsOn: ["^build"]` the
        # `test` job above relies on implicitly. Build everything up front so
        # @crowi/api's workspace dependencies (api-contract, collab, runner,
        # plugin-api, ...) have a `dist/` to resolve against.
        run: pnpm build

      - name: Run flake report (non-blocking)
        run: pnpm test:flake
        continue-on-error: true

  changeset-status:
    # Warn-only check: surfaces missing changesets on PRs without blocking merges.
    # Skipped on forked-PRs since they lack access to the base ref via merge-base.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changeset status
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
        continue-on-error: true