name: CI

on:
  push:
    branches: [main, dev, dev2-2]
    # Skip the code-validating pipeline (test / lint / changeset-status) when a
    # push touches ONLY non-code paths. A mixed code+docs change still runs CI
    # (paths-ignore skips only when EVERY changed file matches). ci.yml itself is
    # deliberately not listed so CI-config changes still get validated.
    paths-ignore: &ci-skip
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - 'apps/crowi-site/**' # validated by its own Cloudflare Pages deploy
      - '.changeset/**'
      # .claude/ の markdown だけ明示的に skip する('.claude/**' は削除済み —
      # コード (workflow JS・scripts・tests) にはテストがあり、一度も実行され
      # ない経路を作らないため)。'**/*.md' が .claude/ 配下(先頭がドットの
      # セグメント)まで届くかは glob 実装依存で確実ではないので、ここで
      # 明示する。
      - '.claude/**/*.md'
      - '.github/workflows/docker.yml'
      - '.github/workflows/docker-elasticsearch.yml'
      - '.github/workflows/release.yml'
      # Negation un-ignores root CLAUDE.md specifically (path filters evaluate
      # in order, last match wins) — '**/*.md' above would otherwise skip CI
      # on a CLAUDE.md-only push, including the exact case claude-md-drift.
      # test.mjs exists to catch (a heading it references gets renamed).
      - '!CLAUDE.md'
  pull_request:
    branches: [main, dev, dev2-2]
    paths-ignore: *ci-skip

env:
  # Single source of truth for the Redis 8.x patch tag Redis-consuming steps
  # below pin to (keep in sync with docker-compose.yml's `redis` /
  # `crowi-test-redis` / `crowi-test-redis-tls` services — same tag
  # everywhere per feature-redis-8-upgrade Phase 1). `services:` blocks
  # can't reference the `env` context, but a parse-time YAML alias works —
  # the service definitions below use `*redis-image`, so this line is the
  # single copy in this file. Keep it in sync with docker-compose.yml's
  # `x-crowi-redis-image` (the one remaining cross-FILE sync point).
  REDIS_IMAGE: &redis-image redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      # The api test harness (`packages/api/src/test/crowi-environment.js`)
      # picks up `MONGO_URI` and connects to this service, giving each
      # jest worker its own per-file database. Memory-server is used as
      # a local fallback only — CI uses the real binary so we don't
      # depend on every CI runner being able to download a mongo
      # binary on cold cache misses (the historic CI failure mode).
      #
      # Anchored (`&api-test-mongo-service`) so the `flake-report` job below
      # can alias the exact same service instead of drifting out of sync —
      # it spawns @crowi/api's jest directly and needs the identical mongo.
      mongo: &api-test-mongo-service
        image: mongo:8.0.4
        ports:
          - 27017:27017
        # `--healthcheck` keeps the job from racing the mongo boot.
        # actions/services blocks the workflow until the container is
        # healthy when health is configured, so jest never sees a
        # "connection refused" on the first test file.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      # Shared Redis 8.x, exercised by 8 of the 9 Redis-consumer smoke tests
      # (feature-redis-8-upgrade Phase 2 — everything except Config pub/sub,
      # which needs a single-subscriber instance and uses `crowi-test-redis`
      # below instead; the account-link `link-completion` smoke test also
      # uses this shared instance). `services:` can't
      # reference `env.REDIS_IMAGE` (see
      # the workflow-level `env:` comment above), so the tag is duplicated
      # here literally. Anchored so `flake-report` below can alias it — that
      # job spawns @crowi/api's jest directly and needs the identical Redis.
      redis: &api-test-redis-service
        image: *redis-image
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      # Config-pub/sub-smoke-ONLY Redis (feature-redis-8-upgrade Phase 1/2).
      # `ConfigService.setupPubSub()`'s fixed, global `'config'` channel makes
      # every subscribing process unconditionally run
      # `load()`/`postUpdate()`/`setupMailer()` — CI jobs are single-tenant
      # per run so this isolation matters less than in a shared dev Redis,
      # but keeping the same dedicated-instance shape as docker-compose.yml
      # avoids a CI-only code path in the smoke test's connection-resolution
      # logic. See docker-compose.yml's `crowi-test-redis` comment for the
      # full rationale.
      crowi-test-redis: &api-test-crowi-redis-service
        image: *redis-image
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Anchored (`&api-test-env`) so `flake-report` below can alias the same
    # env instead of duplicating it — see that job's comment for why it needs
    # to match exactly.
    env: &api-test-env
      NODE_ENV: test
      PASSWORD_SEED: test_password_seed
      # `mongo` service is reachable on localhost (the runner publishes
      # the port). Per-test-file db names are generated by the harness.
      MONGO_URI: mongodb://localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set flake-report run id
        # Run-scoped id (feature-flake-report-detection-redesign AC-1):
        # `turbo.json`'s `globalPassThroughEnv` forwards `CROWI_TEST_RUN_ID`
        # into the api jest child spawned by `pnpm test` below, so
        # `global-setup.js`'s `CROWI_TEST_RUN_ID ??= ...` adopts THIS value
        # instead of self-generating one. `CROWI_TEST_JSON_OUTPUT_FILE`
        # gates `packages/api`'s `test` script into ALSO writing jest's
        # `--json --outputFile` result — CI-only (env-gated), local `pnpm
        # test` is unaffected. The `flake-report` job below recomputes the
        # SAME `CROWI_TEST_RUN_ID` from the SAME `github.run_id`/`run_attempt`
        # context, which is what lets it verify the producer manifest's run
        # id without any extra cross-job handoff.
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          echo "CROWI_TEST_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "CROWI_TEST_JSON_OUTPUT_FILE=/tmp/crowi-api-test-result.$RUN_ID.json" >> "$GITHUB_ENV"

      - &redis-tls-fixture-start
        name: Start Redis TLS fixture
        # TLS connectivity smoke fixture (feature-redis-8-upgrade Phase 1/2,
        # boot/TLS consumer #8). Reuses the self-signed cert pair added in
        # fee9c9a4 (packages/api/src/util/__fixtures__/tls/) rather than a
        # new cert-generation mechanism. Unlike `mongo`/`redis`/
        # `crowi-test-redis` above, this can't be a `services:` entry:
        # GitHub Actions starts `services:` containers BEFORE `actions/
        # checkout`, so they can't mount a repo file — this step runs as a
        # normal job step, after checkout, instead. TLS-only port, no ACL
        # (`--tls-auth-clients no` — no CA cert needed since we don't verify
        # client certs; the smoke client connects with `rejectUnauthorized:
        # false`, matching redis-opts.test.ts's existing TLS repro).
        # Starts docker-compose.yml's `crowi-test-redis-tls` service so the
        # compose file stays the SINGLE source of truth for the fixture's
        # image/flags/port — local and CI cannot drift apart. Anchored so
        # `flake-report` below can alias it instead of duplicating — that
        # job also solo-reruns @crowi/api's jest directly and needs the
        # identical fixture.
        run: docker compose up -d crowi-test-redis-tls

      - &redis-tls-fixture-wait
        name: Wait for Redis TLS fixture
        run: |
          for _ in $(seq 1 30); do
            if docker exec crowi-test-redis-tls redis-cli --tls --insecure -p 6381 ping 2>/dev/null | grep -q PONG; then
              echo "crowi-test-redis-tls is ready"
              exit 0
            fi
            sleep 1
          done
          echo "crowi-test-redis-tls did not become ready in time" >&2
          docker logs crowi-test-redis-tls || true
          exit 1

      - name: Run tests
        run: pnpm test

      - name: Emit flake-report producer manifest
        # Always runs — even after a failed "Run tests" — so a red run still
        # gets an artifact `flake-report` can classify
        # (feature-flake-report-detection-redesign AC-2). Fail-open +
        # `continue-on-error` (belt-and-suspenders): this bookkeeping step
        # must never flip a green `test` job red.
        if: always()
        continue-on-error: true
        run: node scripts/test-flake-report-produce.mjs

      - name: Upload flake-report artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-${{ github.run_id }}-${{ github.run_attempt }}
          # Exact run-scoped basenames the manifest itself names (no globs —
          # AC-2's "manifest の run-ID を検証してから読む"). The near-miss
          # jsonl and (rarely) the jest json commonly don't exist — `warn`
          # (not `error`) so a merely-partial producer output still uploads
          # whatever it did produce.
          path: |
            /tmp/crowi-flake-report-manifest.${{ env.CROWI_TEST_RUN_ID }}.json
            /tmp/crowi-api-test-result.${{ env.CROWI_TEST_RUN_ID }}.json
            /tmp/crowi-api-test-retry-events.${{ env.CROWI_TEST_RUN_ID }}.jsonl
          if-no-files-found: warn

      - name: Run root scripts/ tests
        # Root `scripts/` isn't a turbo workspace package, so `pnpm test`
        # (turbo run test) doesn't reach it — run separately. Also picks up
        # `packages/*/scripts/*.test.mjs` (e.g. paraglide-compile.test.mjs)
        # via the same `node --test` glob: those live inside a workspace
        # package but are plain zero-dep node:test scripts like this dir's,
        # not part of that package's own vitest/jest suite.
        run: pnpm test:scripts

      - name: Run .claude/ shell-script smoke tests
        # orchestrate-watch.sh / task-state.sh / spec-contract validator の
        # bash スモークテスト。node --test 系(test:scripts)ではカバーされない。
        run: pnpm test:scripts:sh

      - name: Build project
        run: pnpm build

      - &redis-tls-fixture-stop
        name: Stop Redis TLS fixture
        if: always()
        run: docker rm -f crowi-test-redis-tls || true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

      - name: Check code formatting
        run: |
          pnpm format
          if [ -n "$(git diff --name-only)" ]; then
            echo "Code is not properly formatted. Please run 'pnpm format' and commit the changes."
            git diff
            exit 1
          fi

  e2e:
    # feature-e2e-in-ci: runs the Playwright suite (packages/e2e) ONLY on a
    # push to `main` — never on `pull_request`, and never on a `dev` /
    # `dev2-2` push either, even though those share this workflow's `on.push`
    # trigger (see `if:` below). Deliberately NOT a PR gate yet: unlike
    # @crowi/api's jest suite, this suite has never been through a dedicated
    # flake-hardening pass (that pass found and fixed 3 independent flake
    # mechanisms in @crowi/api in a single day — see
    # feature-test-harness-shared-server / feature-flake-report-detection-
    # redesign). Gating PRs on an unvetted suite risks normalizing "just
    # re-run it", which is hard to walk back once it takes hold. Running on
    # main push first collects real flake-rate data without blocking PRs, and
    # gives us the `test`/`flake-report` jobs' own history as a template for
    # what a proper flake-hardening pass on this suite would look like.
    #
    # PROMOTION CRITERION (spec: feature-e2e-in-ci): once 20 CONSECUTIVE
    # main-push runs of this job complete with zero non-regression failures
    # (i.e. every failure observed in that window was a genuine regression
    # that got fixed promptly — not an unexplained/flaky red), promote this
    # job onto `pull_request` too (mirror the `test`/`lint` jobs' `on:`
    # trigger above) and delete this comment. If the streak breaks on an
    # unexplained or flaky failure, root-cause and fix the flake first (same
    # discipline as the api jest suite got) before restarting the streak —
    # do not promote on a partial or "probably fine" streak.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      # Same pinned mongo/redis the `test` job uses (aliased, not redefined,
      # so the two can't drift apart) — @crowi/e2e's dedicated api/web
      # instances (started by playwright.config.ts's `webServer` entries)
      # connect to these on their default host ports, matching
      # packages/e2e/src/config.ts's hard-coded E2E_MONGO_URI / start:api's
      # REDIS_URL.
      mongo: *api-test-mongo-service
      redis: *api-test-redis-service

      # Mailpit — SMTP on 1025, HTTP API on 8025. Mirrors docker-compose.yml's
      # `mailpit` service (used for local `pnpm e2e` runs) so local and CI
      # can't drift apart. The image ships its own `HEALTHCHECK CMD
      # ["/mailpit", "readyz"]`, so `--health-cmd` below just invokes that same
      # binary's own readiness check rather than inventing a new one.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      # PlantUML — renderer-plugins.spec.ts renders a real PlantUML diagram
      # through this server and asserts the resulting fragment, so the suite
      # does not pass without it. Mirrors docker-compose.yml's `plantuml`
      # service on 8080.
      #
      # This was missing from the job's first version because the dependency
      # list was taken from preflight.ts, which only asserts mongo/redis/
      # mailpit — preflight is not a complete inventory of what the specs
      # actually reach out to. preflight now asserts this port too, so the
      # next such gap fails fast with a named dependency instead of an
      # assertion two minutes into the run.
      plantuml:
        image: plantuml/plantuml-server:latest
        ports:
          - 8080:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @crowi/e2e exec playwright install --with-deps chromium

      - name: Run e2e suite
        # `time` prints wall-clock duration straight into the step's own log
        # output (AC: "実行時間が job のログから分かる形で記録されている"),
        # so it's visible without depending on the Actions UI's step-duration
        # display. `pnpm e2e` builds the runtime deps it needs
        # (build:runtime), resets the `crowi_e2e` database + Mailpit inbox
        # (global-setup.ts), then runs `playwright test`, which starts its
        # own dedicated api (:4290) / web (:4291) via `start:api`/`start:web`
        # — no separate dev stack to stand up here.
        run: time pnpm e2e

      - name: Upload Playwright artifacts (trace / video / screenshot)
        # Only on failure: with trace: on-first-retry / video:
        # retain-on-failure / screenshot: only-on-failure (playwright.config.ts),
        # a green run's outputDir is empty by design, so uploading
        # unconditionally would just warn on every green run for nothing.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results/
            packages/e2e/playwright-report/
          if-no-files-found: warn

  flake-report:
    # CONSUMER half of the producer/consumer flake-report redesign
    # (feature-flake-report-detection-redesign, superseding the old
    # independent-full-suite `pnpm test:flake` job): downloads the `test`
    # job's producer artifact (manifest + @crowi/api jest `--json` output +
    # near-miss jsonl, all keyed by the SAME `CROWI_TEST_RUN_ID` both jobs
    # independently compute from `github.run_id`-`github.run_attempt`),
    # verifies the manifest's run id, and solo-reruns ONLY the files
    # @crowi/api jest itself did not pass in the run that actually gated
    # `test` — no more disjoint full-suite run that could (and did) observe
    # a different outcome than the one that gated `test`. Classifies each
    # into FLAKY / REGRESSION / INCONCLUSIVE and never reports green when
    # the evidence is missing, foreign, or out of @crowi/api's scope (a
    # non-API failure, a cancelled `test` run, or a lost artifact) — see
    # `scripts/test-flake-report-consume.mjs`. `needs: test` + `if: always()`
    # so a cancelled `test` run still reaches this job (reported as
    # cancelled, never silently skipped-and-invisible). Non-blocking
    # end-to-end (mirrors `changeset-status`'s `continue-on-error: true`
    # position below) — solo-reruns still need the SAME `services`/`env` as
    # `test` (spawns @crowi/api's jest directly, bypassing turbo). Classify is
    # followed by two more non-blocking, `feature-flake-report-triage-loop`
    # steps that turn a classified FLAKY≥1 report into something a human
    # actually sees (the classify step itself was previously read by nobody —
    # see `scripts/test-flake-report-issue.mjs`'s top comment): filing/
    # updating a `flaky-test`-labeled GitHub issue per FLAKY file (or, on a
    # fork PR, degrading to a `::notice::` annotation), and publishing a
    # neutral-conclusion `flake-report` check-run so a FLAKY run is
    # distinguishable from a genuinely clean one without turning it red.
    name: 'flake-report (@crowi/api jest only)'
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write

    services:
      mongo: *api-test-mongo-service
      # feature-redis-8-upgrade Phase 1: this job spawns @crowi/api's jest
      # directly (bypassing turbo, see the "Build workspace packages" step
      # below), so the Redis-consumer smoke tests it solo-reruns need the
      # SAME Redis services the `test` job above provides — aliased rather
      # than redefined so the two jobs can't drift out of sync.
      redis: *api-test-redis-service
      crowi-test-redis: *api-test-crowi-redis-service

    env: *api-test-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set flake-report run id
        # Independently recomputed from the SAME `github.run_id`/`run_attempt`
        # this workflow run's `test` job used — the run-ID correlation AC-2
        # requires, without any extra cross-job handoff. Deliberately BEFORE
        # "Build workspace packages" below: every later step in this job is
        # `if: always()` so it still runs after a failed build, and needs
        # `env.CROWI_TEST_RUN_ID` to already be set — a build failure must
        # not leave the required source-unavailable provenance artifact
        # unwritable/unlocatable (a prior ordering bug did exactly that).
        run: echo "CROWI_TEST_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Determine flake-report triage mode
        # `file` = a push or a SAME-REPO pull_request (the default
        # `GITHUB_TOKEN` there has the `issues`/`checks` write permissions
        # granted above and can safely file/comment on issues + publish a
        # check-run). `annotate` = a fork PR, whose `GITHUB_TOKEN` is
        # read-only — the "File or annotate FLAKY issues" step below degrades
        # to a `::notice::` workflow annotation instead of calling `gh`. Same
        # fork-PR detection formula as the `changeset-status` job's `if:`
        # below. Computed once via `$GITHUB_ENV` (not re-evaluated inline in
        # each later step) so both the issue-triage and check-run steps read
        # the identical decision.
        run: |
          if [ "${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}" = "true" ]; then
            echo "CROWI_FLAKE_ISSUE_MODE=file" >> "$GITHUB_ENV"
          else
            echo "CROWI_FLAKE_ISSUE_MODE=annotate" >> "$GITHUB_ENV"
          fi
          echo "CROWI_FLAKE_REF_LABEL=${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}" >> "$GITHUB_ENV"

      # Same fixture as the `test` job's "Start Redis TLS fixture" step
      # (see that step's comment for the full rationale) — this job's
      # "Classify + report" step below solo-reruns @crowi/api's jest
      # directly, so it needs the same TLS-connectivity smoke fixture
      # available. Aliased rather than redefined so the two jobs can't
      # drift out of sync.
      - *redis-tls-fixture-start

      - *redis-tls-fixture-wait

      - name: Build workspace packages
        # Solo-reruns spawn `@crowi/api`'s jest DIRECTLY (bypassing turbo —
        # see `scripts/test-flake-report-consume.mjs`), so, like the job this
        # replaces, it needs a `dist/` for @crowi/api's workspace
        # dependencies (api-contract, collab, runner, plugin-api, ...) up
        # front.
        run: pnpm build

      - name: Download flake-report artifact
        id: download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: flake-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/flake-report-artifact

      - name: Classify + report (non-blocking)
        if: always()
        continue-on-error: true
        env:
          CROWI_FLAKE_REPORT_TEST_JOB_RESULT: ${{ needs.test.result }}
          CROWI_FLAKE_REPORT_ARTIFACT_DIR: /tmp/flake-report-artifact
          CROWI_FLAKE_REPORT_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node scripts/test-flake-report-consume.mjs

      - name: Surface FLAKY files — issues, annotation, check-run (non-blocking)
        # feature-flake-report-triage-loop: reads the classification report
        # `Classify + report` just wrote (never re-derives classification
        # logic — see scripts/test-flake-report-issue.mjs's top comment) and,
        # per FLAKY file, files/updates a `flaky-test`-labeled GitHub issue
        # (`file` mode) or emits a `::notice::` annotation instead (`annotate`
        # mode, fork PRs), plus AC-9's neutral check-run in `file` mode.
        # Fail-open end to end: the script itself always exits 0, and this
        # step ALSO sets `continue-on-error: true` as belt-and-suspenders —
        # surfacing a flake must never affect this job's (already
        # non-blocking) red/green, let alone `test`'s.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # AC-9's neutral check-run is published by the same script (it
          # already resolved the report, the mode and the FLAKY count — a
          # `jq` twin here would be a second, untested copy of that gate).
          # `head_sha` must come from the workflow: a PR's `GITHUB_SHA` is the
          # merge commit, not the head the checks hang off.
          CROWI_FLAKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/test-flake-report-issue.mjs

      - name: Upload flake-report classification artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/crowi-flake-report-classification.${{ env.CROWI_TEST_RUN_ID }}.json
          if-no-files-found: warn

      - *redis-tls-fixture-stop

  changeset-status:
    # Warn-only check: surfaces missing changesets on PRs without blocking merges.
    # Skipped on forked-PRs since they lack access to the base ref via merge-base.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changeset status
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
        continue-on-error: true