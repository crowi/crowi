name: CI

on:
  push:
    branches: [main, dev, dev2-2]
    # Skip the code-validating pipeline (test / lint / changeset-status) when a
    # push touches ONLY non-code paths. A mixed code+docs change still runs CI
    # (paths-ignore skips only when EVERY changed file matches). ci.yml itself is
    # deliberately not listed so CI-config changes still get validated.
    paths-ignore: &ci-skip
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - 'apps/crowi-site/**' # validated by its own Cloudflare Pages deploy
      - '.changeset/**'
      - '.claude/**'
      - '.github/workflows/docker.yml'
      - '.github/workflows/docker-elasticsearch.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, dev, dev2-2]
    paths-ignore: *ci-skip

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      # The api test harness (`packages/api/src/test/crowi-environment.js`)
      # picks up `MONGO_URI` and connects to this service, giving each
      # jest worker its own per-file database. Memory-server is used as
      # a local fallback only — CI uses the real binary so we don't
      # depend on every CI runner being able to download a mongo
      # binary on cold cache misses (the historic CI failure mode).
      #
      # Anchored (`&api-test-mongo-service`) so the `flake-report` job below
      # can alias the exact same service instead of drifting out of sync —
      # it spawns @crowi/api's jest directly and needs the identical mongo.
      mongo: &api-test-mongo-service
        image: mongo:8.0.4
        ports:
          - 27017:27017
        # `--healthcheck` keeps the job from racing the mongo boot.
        # actions/services blocks the workflow until the container is
        # healthy when health is configured, so jest never sees a
        # "connection refused" on the first test file.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Anchored (`&api-test-env`) so `flake-report` below can alias the same
    # env instead of duplicating it — see that job's comment for why it needs
    # to match exactly.
    env: &api-test-env
      NODE_ENV: test
      PASSWORD_SEED: test_password_seed
      # `mongo` service is reachable on localhost (the runner publishes
      # the port). Per-test-file db names are generated by the harness.
      MONGO_URI: mongodb://localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set flake-report run id
        # Run-scoped id (feature-flake-report-detection-redesign AC-1):
        # `turbo.json`'s `globalPassThroughEnv` forwards `CROWI_TEST_RUN_ID`
        # into the api jest child spawned by `pnpm test` below, so
        # `global-setup.js`'s `CROWI_TEST_RUN_ID ??= ...` adopts THIS value
        # instead of self-generating one. `CROWI_TEST_JSON_OUTPUT_FILE`
        # gates `packages/api`'s `test` script into ALSO writing jest's
        # `--json --outputFile` result — CI-only (env-gated), local `pnpm
        # test` is unaffected. The `flake-report` job below recomputes the
        # SAME `CROWI_TEST_RUN_ID` from the SAME `github.run_id`/`run_attempt`
        # context, which is what lets it verify the producer manifest's run
        # id without any extra cross-job handoff.
        run: |
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          echo "CROWI_TEST_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "CROWI_TEST_JSON_OUTPUT_FILE=/tmp/crowi-api-test-result.$RUN_ID.json" >> "$GITHUB_ENV"

      - name: Run tests
        run: pnpm test

      - name: Emit flake-report producer manifest
        # Always runs — even after a failed "Run tests" — so a red run still
        # gets an artifact `flake-report` can classify
        # (feature-flake-report-detection-redesign AC-2). Fail-open +
        # `continue-on-error` (belt-and-suspenders): this bookkeeping step
        # must never flip a green `test` job red.
        if: always()
        continue-on-error: true
        run: node scripts/test-flake-report-produce.mjs

      - name: Upload flake-report artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-${{ github.run_id }}-${{ github.run_attempt }}
          # Exact run-scoped basenames the manifest itself names (no globs —
          # AC-2's "manifest の run-ID を検証してから読む"). The near-miss
          # jsonl and (rarely) the jest json commonly don't exist — `warn`
          # (not `error`) so a merely-partial producer output still uploads
          # whatever it did produce.
          path: |
            /tmp/crowi-flake-report-manifest.${{ env.CROWI_TEST_RUN_ID }}.json
            /tmp/crowi-api-test-result.${{ env.CROWI_TEST_RUN_ID }}.json
            /tmp/crowi-api-test-retry-events.${{ env.CROWI_TEST_RUN_ID }}.jsonl
          if-no-files-found: warn

      - name: Run root scripts/ tests
        # Not part of any turbo package (scripts/ isn't a workspace package), so
        # `pnpm test` (turbo run test) doesn't reach it — run separately.
        run: pnpm test:scripts

      - name: Build project
        run: pnpm build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

      - name: Check code formatting
        run: |
          pnpm format
          if [ -n "$(git diff --name-only)" ]; then
            echo "Code is not properly formatted. Please run 'pnpm format' and commit the changes."
            git diff
            exit 1
          fi

  flake-report:
    # CONSUMER half of the producer/consumer flake-report redesign
    # (feature-flake-report-detection-redesign, superseding the old
    # independent-full-suite `pnpm test:flake` job): downloads the `test`
    # job's producer artifact (manifest + @crowi/api jest `--json` output +
    # near-miss jsonl, all keyed by the SAME `CROWI_TEST_RUN_ID` both jobs
    # independently compute from `github.run_id`-`github.run_attempt`),
    # verifies the manifest's run id, and solo-reruns ONLY the files
    # @crowi/api jest itself did not pass in the run that actually gated
    # `test` — no more disjoint full-suite run that could (and did) observe
    # a different outcome than the one that gated `test`. Classifies each
    # into FLAKY / REGRESSION / INCONCLUSIVE and never reports green when
    # the evidence is missing, foreign, or out of @crowi/api's scope (a
    # non-API failure, a cancelled `test` run, or a lost artifact) — see
    # `scripts/test-flake-report-consume.mjs`. `needs: test` + `if: always()`
    # so a cancelled `test` run still reaches this job (reported as
    # cancelled, never silently skipped-and-invisible). Non-blocking
    # end-to-end (mirrors `changeset-status`'s `continue-on-error: true`
    # position below) — solo-reruns still need the SAME `services`/`env` as
    # `test` (spawns @crowi/api's jest directly, bypassing turbo).
    name: 'flake-report (@crowi/api jest only)'
    needs: test
    if: always()
    runs-on: ubuntu-latest

    services:
      mongo: *api-test-mongo-service

    env: *api-test-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set flake-report run id
        # Independently recomputed from the SAME `github.run_id`/`run_attempt`
        # this workflow run's `test` job used — the run-ID correlation AC-2
        # requires, without any extra cross-job handoff. Deliberately BEFORE
        # "Build workspace packages" below: every later step in this job is
        # `if: always()` so it still runs after a failed build, and needs
        # `env.CROWI_TEST_RUN_ID` to already be set — a build failure must
        # not leave the required source-unavailable provenance artifact
        # unwritable/unlocatable (a prior ordering bug did exactly that).
        run: echo "CROWI_TEST_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Build workspace packages
        # Solo-reruns spawn `@crowi/api`'s jest DIRECTLY (bypassing turbo —
        # see `scripts/test-flake-report-consume.mjs`), so, like the job this
        # replaces, it needs a `dist/` for @crowi/api's workspace
        # dependencies (api-contract, collab, runner, plugin-api, ...) up
        # front.
        run: pnpm build

      - name: Download flake-report artifact
        id: download
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: flake-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/flake-report-artifact

      - name: Classify + report (non-blocking)
        if: always()
        continue-on-error: true
        env:
          CROWI_FLAKE_REPORT_TEST_JOB_RESULT: ${{ needs.test.result }}
          CROWI_FLAKE_REPORT_ARTIFACT_DIR: /tmp/flake-report-artifact
          CROWI_FLAKE_REPORT_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node scripts/test-flake-report-consume.mjs

      - name: Upload flake-report classification artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/crowi-flake-report-classification.${{ env.CROWI_TEST_RUN_ID }}.json
          if-no-files-found: warn

  changeset-status:
    # Warn-only check: surfaces missing changesets on PRs without blocking merges.
    # Skipped on forked-PRs since they lack access to the base ref via merge-base.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changeset status
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
        continue-on-error: true