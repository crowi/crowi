name: Docs

# ci.yml deliberately skips its whole pipeline for docs-only pushes
# (paths-ignore covers '**/*.mdx' and 'apps/crowi-site/**'), so the link guard
# chained into `pnpm lint` never runs for exactly the change class it protects.
# The Cloudflare Pages deploy does not cover it either: a static export emits an
# unresolvable relative link as a plain anchor and still builds green.
#
# This workflow is the missing gate for both docs guards — the structural
# link check and the editorial vocabulary check. It is deliberately tiny: the
# checkers import nothing outside the node standard library, so there is no
# install step and nothing to cache.
on:
  push:
    branches: [main, dev, dev2-2]
    paths: &docs-paths
      - 'apps/crowi-site/content/docs/**'
      - 'scripts/check-docs-links.mjs'
      - 'scripts/check-docs-links.test.mjs'
      - 'scripts/check-docs-vocabulary.mjs'
      - 'scripts/check-docs-vocabulary.test.mjs'
      - 'scripts/docs-vocabulary-allow.json'
      - 'scripts/docs-glossary.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev, dev2-2]
    paths: *docs-paths

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Runs on Linux, so a destination whose case differs from the file on
      # disk fails here even when the author's macOS checkout accepted it.
      - name: Check docs in-site links
        run: node scripts/check-docs-links.mjs

      # guide/, operations/ and reference/ are written for people who use or
      # run Crowi; naming an internal here is an editorial regression the
      # build cannot see. Canonical terminology is checked on every page,
      # develop/ included — one concept has one name across the whole docs,
      # and the vocabulary itself comes from scripts/docs-glossary.json.
      - name: Check docs vocabulary
        run: node scripts/check-docs-vocabulary.mjs

      - name: Test the docs checkers
        run: node --test scripts/check-docs-links.test.mjs scripts/check-docs-vocabulary.test.mjs
