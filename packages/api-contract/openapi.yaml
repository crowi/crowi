      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - installer_required
                required:
                  - status
  /installer/createAdmin:
    post:
      summary: Create initial admin user
      tags: *ref_1
      parameters: []
      operationId: createAdmin
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                registerForm:
                  type: object
                  properties:
                    username:
                      type: string
                    name:
                      type: string
