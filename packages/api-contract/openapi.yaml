        '200':
          description: Personal access token list (no secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessTokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        expiresAt:
                          type:
                            - string
                            - 'null'
                        lastUsedAt:
                          type:
                            - string
                            - 'null'
                        createdAt:
                          type: string
                      required:
                        - id
                        - name
                        - scopes
                        - expiresAt
                        - lastUsedAt
                        - createdAt
                required:
                  - accessTokens
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - AUTHENTICATION_REQUIRED
                      message:
                        type: string
                        enum:
                          - Authentication is required
                      redirectTo:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '403':
          description: Personal access tokens can only be managed from a web session
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - FORBIDDEN
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
    post:
      tags:
        - me
      security:
        - bearerAuth: []
      summary: Issue a personal access token (plaintext returned once)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                scopes:
                  type: array
                  items:
                    type: string
                  minItems: 1
                expiresAt:
                  type:
                    - string
                    - 'null'
                  format: date-time
              required:
                - name
                - scopes
      responses:
        '201':
          description: Token issued; `token` holds the one-time plaintext secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  expiresAt:
                    type:
                      - string
                      - 'null'
                  lastUsedAt:
                    type:
                      - string
                      - 'null'
                  createdAt:
                    type: string
                  token:
                    type: string
                required:
                  - id
                  - name
                  - scopes
                  - expiresAt
                  - lastUsedAt
                  - createdAt
                  - token
        '400':
          description: One or more requested scopes are not issuable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_SCOPE
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          invalidScopes:
                            type: array
                            items:
                              type: string
                        required:
                          - invalidScopes
                    required:
                      - code
                      - message
                required:
                  - error
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
