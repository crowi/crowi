                    id:
                      type: string
                    username:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    image:
                      type:
                        - string
                        - 'null'
                    createdAt:
                      type: string
                  required:
                    - _id
                    - username
                    - name
                    - email
                    - createdAt
                createdAt:
                  type: string
                meta:
                  type: object
                  properties:
                    toc:
                      type: array
                      items:
                        type: object
                        properties:
                          level:
                            type: integer
                            minimum: 1
                            maximum: 6
                          text:
                            type: string
                          anchorId:
                            type: string
