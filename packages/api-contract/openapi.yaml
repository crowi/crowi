                  refreshToken:
                    type: string
                  expiresIn:
                    type: number
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      image:
                        type: string
                    required:
                      - id
                      - username
                      - email
                      - name
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - user
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
