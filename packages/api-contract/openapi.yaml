openapi: 3.1.0
info:
  title: Crowi API
  description: API for Crowi - Markdown-based Wiki Application
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v2
    description: Local development server
  - url: https://your-crowi-instance.com/api/v2
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details: {}
          required:
            - code
            - message
      required:
        - error
    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - ADMIN_REQUIRED
        - THIRD_PARTY_AUTH_REQUIRED
        - USER_REGISTERED
        - USER_SUSPENDED
        - USER_INVITED
        - USER_NOT_ACTIVE
        - EMAIL_NOT_CONFIRMED
        - INTERNAL_ERROR
        - VALIDATION_ERROR
        - INVALID_REQUEST
        - NOT_FOUND
        - CONFLICT
        - SERVICE_UNAVAILABLE
        - APPLICATION_NOT_INSTALLED
        - INVALID_PAGE_ID
        - PAGE_NOT_FOUND
        - PAGE_NOT_GRANTED
        - PAGE_REVISION_ERROR
        - PAGE_TWIN_EXISTS
        - INVALID_GRANT
        - COMMENT_NOT_FOUND
        - NOTIFICATION_NOT_FOUND
        - USER_NOT_FOUND
        - USER_EXISTS
        - USERNAME_TAKEN
        - EMAIL_TAKEN
        - EMAIL_NOT_ALLOWED
        - INVALID_ACTIVATION_TOKEN
        - INVALID_INVITE_TOKEN
        - INVITE_ALREADY_ACCEPTED
        - INVALID_RESET_TOKEN
        - INVALID_EMAIL_CHANGE_TOKEN
        - INVALID_CREDENTIALS
        - REFRESH_TOKEN_REQUIRED
        - REGISTRATION_CLOSED
        - ENCRYPTION_NOT_CONFIGURED
        - MAIL_TEST_FAILED
        - PLUGIN_NOT_FOUND
        - PLUGIN_CONFIG_VALIDATION_FAILED
    ApplicationNotInstalledError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - APPLICATION_NOT_INSTALLED
            message:
              type: string
              enum:
                - Application is not installed
            redirectTo:
              type: string
              enum:
                - /installer
          required:
            - code
            - message
            - redirectTo
      required:
        - error
    AuthenticationRequiredError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
            message:
              type: string
              enum:
                - Authentication is required
            redirectTo:
              type: string
          required:
            - code
            - message
      required:
        - error
    AdminRequiredError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - ADMIN_REQUIRED
            message:
              type: string
              enum:
                - Admin permission required
            redirectTo:
              type: string
          required:
            - code
            - message
      required:
        - error
    UserStatusError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - USER_REGISTERED
                - USER_SUSPENDED
                - USER_INVITED
            message:
              type: string
            redirectTo:
              type: string
          required:
            - code
            - message
            - redirectTo
      required:
        - error
    ThirdPartyAuthRequiredError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - THIRD_PARTY_AUTH_REQUIRED
            message:
              type: string
              enum:
                - Third party authentication is required
            redirectTo:
              type: string
          required:
            - code
            - message
            - redirectTo
      required:
        - error
    InternalServerError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - INTERNAL_ERROR
            message:
              type: string
              enum:
                - Internal server error
          required:
            - code
            - message
      required:
        - error
    InvalidPageIdError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - INVALID_PAGE_ID
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              properties:
                fieldErrors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                formErrors:
                  type: array
                  items:
                    type: string
              required:
                - fieldErrors
                - formErrors
          required:
            - code
            - message
      required:
        - error
    NotFoundError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    ConflictError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - CONFLICT
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    ServiceUnavailableError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - SERVICE_UNAVAILABLE
            feature:
              type: string
            message:
              type: string
          required:
            - code
            - feature
            - message
      required:
        - error
    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - access_denied
            - authorization_pending
            - slow_down
            - expired_token
        error_description:
          type: string
      required:
        - error
    AuthorizeRequest:
      type: object
      properties:
        client_id:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
        code_challenge:
          type: string
          minLength: 1
        code_challenge_method:
          type: string
          enum:
            - S256
        state:
          type: string
      required:
        - client_id
        - redirect_uri
        - scope
        - code_challenge
        - code_challenge_method
    AuthorizeResponse:
      type: object
      properties:
        redirectUri:
          type: string
      required:
        - redirectUri
    TokenRequest:
      oneOf:
        - type: object
          properties:
            grant_type:
              type: string
              enum:
                - authorization_code
            code:
              type: string
              minLength: 1
            code_verifier:
              type: string
              minLength: 1
            redirect_uri:
              type: string
              minLength: 1
            client_id:
              type: string
              minLength: 1
          required:
            - grant_type
            - code
            - code_verifier
            - redirect_uri
            - client_id
        - type: object
          properties:
            grant_type:
              type: string
              enum:
                - refresh_token
            refresh_token:
              type: string
              minLength: 1
            client_id:
              type: string
              minLength: 1
            scope:
              type: string
          required:
            - grant_type
            - refresh_token
            - client_id
        - type: object
          properties:
            grant_type:
              type: string
              enum:
                - urn:ietf:params:oauth:grant-type:device_code
            device_code:
              type: string
              minLength: 1
            client_id:
              type: string
              minLength: 1
          required:
            - grant_type
            - device_code
            - client_id
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: number
        refresh_token:
          type: string
        scope:
          type: string
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - scope
    RevokeRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        token_type_hint:
          type: string
      required:
        - token
    DiscoveryResponse:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        revocation_endpoint:
          type: string
        device_authorization_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - revocation_endpoint
        - scopes_supported
        - response_types_supported
        - grant_types_supported
        - code_challenge_methods_supported
        - token_endpoint_auth_methods_supported
    DeviceAuthorizeRequest:
      type: object
      properties:
        client_id:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
      required:
        - client_id
        - scope
    DeviceAuthorizeResponse:
      type: object
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: number
        interval:
          type: number
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
    DeviceInfoResponse:
      type: object
      properties:
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
      required:
        - client_id
        - scopes
    DeviceVerifyRequest:
      type: object
      properties:
        user_code:
          type: string
          minLength: 1
        action:
          type: string
          enum:
            - approve
            - deny
      required:
        - user_code
        - action
    DeviceVerifyResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - denied
      required:
        - status
    UserPublic:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        image:
          type:
            - string
            - 'null'
        introduction:
          type: string
        createdAt:
          type: string
        admin:
          type: boolean
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
      required:
        - _id
        - username
        - name
        - email
        - createdAt
    PageUser:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        image:
          type:
            - string
            - 'null'
        createdAt:
          type: string
      required:
        - _id
        - username
        - name
        - email
        - createdAt
    Page:
      type: object
      properties:
        _id:
          type: string
        path:
          type: string
        revision:
          anyOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                path:
                  type: string
                body:
                  type: string
                format:
                  type: string
                  default: markdown
                author:
                  type:
                    - object
                    - 'null'
                  properties:
                    _id:
                      type: string
                    id:
                      type: string
                    username:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    image:
                      type:
                        - string
                        - 'null'
                    createdAt:
                      type: string
                  required:
                    - _id
                    - username
                    - name
                    - email
                    - createdAt
                createdAt:
                  type: string
                meta:
                  type: object
                  properties:
                    toc:
                      type: array
                      items:
                        type: object
                        properties:
                          level:
                            type: integer
                            minimum: 1
                            maximum: 6
                          text:
                            type: string
                          anchorId:
                            type: string
                        required:
                          - level
                          - text
                          - anchorId
                    wikiLinks:
                      type: array
                      items:
                        type: object
                        properties:
                          raw:
                            type: string
                          target:
                            type: string
                          displayText:
                            type: string
                        required:
                          - raw
                          - target
                    mentions:
                      type: array
                      items:
                        type: object
                        properties:
                          username:
                            type: string
                        required:
                          - username
                    codeBlockLanguages:
                      type: array
                      items:
                        type: string
                renderedAst: {}
                rendererVersion:
                  type: string
                parentRevisionId:
                  type:
                    - string
                    - 'null'
                type:
                  type: string
                  enum:
                    - snapshot
                    - incremental
                savedBy:
                  anyOf:
                    - type: string
                    - type: object
                      properties:
                        _id:
                          type: string
                        id:
                          type: string
                        username:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                          format: email
                        image:
                          type:
                            - string
                            - 'null'
                        createdAt:
                          type: string
                      required:
                        - _id
                        - username
                        - name
                        - email
                        - createdAt
                    - type: 'null'
                contributors:
                  type: array
                  items:
                    anyOf:
                      - type: string
                      - type: object
                        properties:
                          _id:
                            type: string
                          id:
                            type: string
                          username:
                            type: string
                          name:
                            type: string
                          email:
                            type: string
                            format: email
                          image:
                            type:
                              - string
                              - 'null'
                          createdAt:
                            type: string
                        required:
                          - _id
                          - username
                          - name
                          - email
                          - createdAt
                message:
                  type: string
                editVia:
                  type: string
                  enum:
                    - web
                    - oauth
                    - pat
              required:
                - _id
                - path
                - body
                - createdAt
        redirectTo:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
          enum:
            - wip
            - published
            - deleted
            - deprecated
            - draft
            - null
        grant:
          type: number
        grantedUsers:
          type: array
          items:
            type: string
        creator:
          anyOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                id:
                  type: string
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                image:
                  type:
                    - string
                    - 'null'
                createdAt:
                  type: string
              required:
                - _id
                - username
                - name
                - email
                - createdAt
            - type: 'null'
        lastUpdateUser:
          anyOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                id:
                  type: string
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                image:
                  type:
                    - string
                    - 'null'
                createdAt:
                  type: string
              required:
                - _id
                - username
                - name
                - email
                - createdAt
            - type: 'null'
        liker:
          type: array
          items:
            type: string
        commentCount:
          type: number
          default: 0
        extended:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
        updatedAt:
          type: string
        currentRevision:
          type:
            - string
            - 'null'
        yjsCheckpointAt:
          type:
            - string
            - 'null'
        latestRevision:
          type: string
        likerCount:
          type: number
        seenUsersCount:
          type: number
      required:
        - _id
        - path
        - createdAt
    PageWithRevision:
      type: object
      properties:
        _id:
          type: string
        path:
          type: string
        revision:
          type: object
          properties:
            _id:
              type: string
            path:
              type: string
            body:
              type: string
            format:
              type: string
              default: markdown
            author:
              type:
                - object
                - 'null'
              properties:
                _id:
                  type: string
                id:
                  type: string
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                image:
                  type:
                    - string
                    - 'null'
                createdAt:
                  type: string
              required:
                - _id
                - username
                - name
                - email
                - createdAt
            createdAt:
              type: string
            meta:
              type: object
              properties:
                toc:
                  type: array
                  items:
                    type: object
                    properties:
                      level:
                        type: integer
                        minimum: 1
                        maximum: 6
                      text:
                        type: string
                      anchorId:
                        type: string
                    required:
                      - level
                      - text
                      - anchorId
                wikiLinks:
                  type: array
                  items:
                    type: object
                    properties:
                      raw:
                        type: string
                      target:
                        type: string
                      displayText:
                        type: string
                    required:
                      - raw
                      - target
                mentions:
                  type: array
                  items:
                    type: object
                    properties:
                      username:
                        type: string
                    required:
                      - username
                codeBlockLanguages:
                  type: array
                  items:
                    type: string
            renderedAst: {}
            rendererVersion:
              type: string
            parentRevisionId:
              type:
                - string
                - 'null'
            type:
              type: string
              enum:
                - snapshot
                - incremental
            savedBy:
              anyOf:
                - type: string
                - type: object
                  properties:
                    _id:
                      type: string
                    id:
                      type: string
                    username:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    image:
                      type:
                        - string
                        - 'null'
                    createdAt:
                      type: string
                  required:
                    - _id
                    - username
                    - name
                    - email
                    - createdAt
                - type: 'null'
            contributors:
              type: array
              items:
                anyOf:
                  - type: string
                  - type: object
                    properties:
                      _id:
                        type: string
                      id:
                        type: string
                      username:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      image:
                        type:
                          - string
                          - 'null'
                      createdAt:
                        type: string
                    required:
                      - _id
                      - username
                      - name
                      - email
                      - createdAt
            message:
              type: string
            editVia:
              type: string
              enum:
                - web
                - oauth
                - pat
          required:
            - _id
            - path
            - body
            - createdAt
        redirectTo:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
          enum:
            - wip
            - published
            - deleted
            - deprecated
            - draft
            - null
        grant:
          type: number
        grantedUsers:
          type: array
          items:
            type: string
        creator:
          type:
            - object
            - 'null'
          properties:
            _id:
              type: string
            id:
              type: string
            username:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
            image:
              type:
                - string
                - 'null'
            createdAt:
              type: string
          required:
            - _id
            - username
            - name
            - email
            - createdAt
        lastUpdateUser:
          type:
            - object
            - 'null'
          properties:
            _id:
              type: string
            id:
              type: string
            username:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
            image:
              type:
                - string
                - 'null'
            createdAt:
              type: string
          required:
            - _id
            - username
            - name
            - email
            - createdAt
        liker:
          type: array
          items:
            type: string
        commentCount:
          type: number
          default: 0
        extended:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
        updatedAt:
          type: string
        currentRevision:
          type:
            - string
            - 'null'
        yjsCheckpointAt:
          type:
            - string
            - 'null'
        latestRevision:
          type: string
        likerCount:
          type: number
        seenUsersCount:
          type: number
      required:
        - _id
        - path
        - revision
        - createdAt
    Revision:
      type: object
      properties:
        _id:
          type: string
        path:
          type: string
        body:
          type: string
        format:
          type: string
          default: markdown
        author:
          type:
            - object
            - 'null'
          properties:
            _id:
              type: string
            id:
              type: string
            username:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
            image:
              type:
                - string
                - 'null'
            createdAt:
              type: string
          required:
            - _id
            - username
            - name
            - email
            - createdAt
        createdAt:
          type: string
        meta:
          type: object
          properties:
            toc:
              type: array
              items:
                type: object
                properties:
                  level:
                    type: integer
                    minimum: 1
                    maximum: 6
                  text:
                    type: string
                  anchorId:
                    type: string
                required:
                  - level
                  - text
                  - anchorId
            wikiLinks:
              type: array
              items:
                type: object
                properties:
                  raw:
                    type: string
                  target:
                    type: string
                  displayText:
                    type: string
                required:
                  - raw
                  - target
            mentions:
              type: array
              items:
                type: object
                properties:
                  username:
                    type: string
                required:
                  - username
            codeBlockLanguages:
              type: array
              items:
                type: string
        renderedAst: {}
        rendererVersion:
          type: string
        parentRevisionId:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - snapshot
            - incremental
        savedBy:
          anyOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                id:
                  type: string
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                image:
                  type:
                    - string
                    - 'null'
                createdAt:
                  type: string
              required:
                - _id
                - username
                - name
                - email
