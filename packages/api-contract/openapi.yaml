  parameters: {}
paths:
  /app/info:
    get:
      tags:
        - app
      summary: Get public application info (site title etc.)
      responses:
        '200':
          description: Public application info
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type:
                      - string
                      - 'null'
                  confidential:
                    type:
                      - string
                      - 'null'
                  version:
                    type: string
                  apiVersion:
                    type: string
                  capabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
                  canSelfRegister:
                    type: boolean
                required:
                  - title
                  - confidential
                  - version
                  - apiVersion
                  - capabilities
                  - canSelfRegister
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
  /installer:
    get:
      tags:
        - installer
      summary: Get installer status
      responses:
        '200':
          description: Installer status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - installer_required
                      - already_installed
                required:
                  - status
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
  /installer/createAdmin:
    post:
      tags:
        - installer
      summary: Create initial admin user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registerForm:
                  type: object
                  properties:
                    username:
                      type: string
                      minLength: 1
                      pattern: ^[\da-zA-Z\-_.]+$
                    name:
                      type: string
                      minLength: 1
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 6
                      pattern: ^[\x20-\x7F]{6,}$
                  required:
                    - username
                    - name
                    - email
                    - password
              required:
                - registerForm
      responses:
        '200':
          description: >-
            Admin creation result (status=ok on success, status=error on
            validation failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
        '400':
          description: Application is already installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/login:
    post:
      tags:
        - tokenAuth
      summary: Authenticate user and receive tokens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
              required:
                - email
                - password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: number
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      image:
                        type: string
                      admin:
                        type: boolean
                    required:
                      - id
                      - username
                      - email
                      - name
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - user
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '403':
          description: User account is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
        '503':
          description: Application is not installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - APPLICATION_NOT_INSTALLED
                      message:
                        type: string
                        enum:
                          - Application is not installed
                      redirectTo:
                        type: string
                        enum:
                          - /installer
                    required:
                      - code
                      - message
                      - redirectTo
                required:
                  - error
  /auth/register:
    post:
      tags:
        - tokenAuth
      summary: >-
        Register a new user; sends an activation email or queues for admin
        approval
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
              required:
                - username
                - name
                - email
                - password
      responses:
        '200':
          description: >-
            Registration accepted; activation pending (email confirmation or
            admin approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - confirmation_required
                      - approval_required
                required:
                  - status
        '400':
          description: Registration failed (validation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '403':
          description: Registration is closed by the admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '409':
          description: User with the same email or username already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
        '503':
          description: Application is not installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - APPLICATION_NOT_INSTALLED
                      message:
                        type: string
                        enum:
                          - Application is not installed
                      redirectTo:
                        type: string
                        enum:
                          - /installer
                    required:
                      - code
                      - message
                      - redirectTo
                required:
                  - error
  /auth/refresh:
    post:
      tags:
        - tokenAuth
      summary: Refresh access token using refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Refreshed tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: number
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      image:
                        type: string
                      admin:
                        type: boolean
                    required:
                      - id
                      - username
                      - email
                      - name
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - user
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - AUTHENTICATION_REQUIRED
                      message:
                        type: string
                        enum:
                          - Authentication is required
                      redirectTo:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        '404':
          description: Associated user no longer exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        $ref: '#/components/schemas/ErrorCode'
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                required:
                  - error
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INTERNAL_ERROR
                      message:
                        type: string
                        enum:
                          - Internal server error
                    required:
                      - code
                      - message
                required:
                  - error
  /auth/logout:
    post:
      tags:
        - tokenAuth
      security:
        - bearerAuth: []
