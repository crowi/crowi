openapi: 3.1.0
info:
  title: Crowi API
  description: API for Crowi - Markdown-based Wiki Application
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v2
    description: Local development server
  - url: https://your-crowi-instance.com/api/v2
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
      required:
        - error
    ApplicationNotInstalledError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - APPLICATION_NOT_INSTALLED
            message:
              type: string
              enum:
                - Application is not installed
            redirectTo:
              type: string
              enum:
                - /installer
          required:
            - code
            - message
            - redirectTo
      required:
        - error
    AuthenticationRequiredError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
            message:
              type: string
              enum:
                - Authentication is required
            redirectTo:
              type: string
          required:
            - code
            - message
      required:
        - error
    AdminRequiredError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - ADMIN_REQUIRED
            message:
              type: string
              enum:
                - Admin permission required
            redirectTo:
              type: string
          required:
            - code
            - message
      required:
        - error
    UserStatusError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - USER_REGISTERED
                - USER_SUSPENDED
                - USER_INVITED
            message:
              type: string
            redirectTo:
              type: string
          required:
            - code
            - message
            - redirectTo
      required:
        - error
    ThirdPartyAuthRequiredError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - THIRD_PARTY_AUTH_REQUIRED
            message:
              type: string
              enum:
                - Third party authentication is required
            redirectTo:
              type: string
          required:
            - code
            - message
            - redirectTo
      required:
        - error
    InternalServerError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - INTERNAL_ERROR
            message:
              type: string
              enum:
                - Internal server error
          required:
            - code
            - message
      required:
        - error
    InvalidPageIdError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - INVALID_PAGE_ID
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              properties:
                fieldErrors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                formErrors:
                  type: array
                  items:
                    type: string
              required:
                - fieldErrors
                - formErrors
          required:
            - code
            - message
      required:
        - error
    NotFoundError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
            message:
              type: string
          required:
            - code
            - message
      required:
