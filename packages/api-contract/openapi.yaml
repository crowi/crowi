                    enum:
                      - error
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - errors
        '302':
          description: '302'
          content:
            application/json:
              schema: {}
  /auth/login:
    post:
      summary: Authenticate user and receive tokens
      tags: &ref_2
        - tokenAuth
      parameters: []
      operationId: tokenLogin
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
              required:
                - email
                - password
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: number
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      image:
                        type: string
                    required:
                      - id
                      - username
                      - email
                      - name
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - user
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        nullable: true
                    required:
                      - code
                      - message
                required:
                  - error
        '401':
          description: '401'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
