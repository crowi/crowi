  /auth/refresh:
    post:
      summary: Refresh access token using refresh token
      tags: *ref_2
      parameters: []
      operationId: tokenRefresh
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
