      tags: *ref_2
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
            pattern: ^Bearer .+$
      operationId: tokenLogout
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
