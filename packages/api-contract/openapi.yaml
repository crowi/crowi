openapi: 3.0.2
paths:
  /login:
    get:
      summary: Display login page
      tags: &ref_0
        - auth
      parameters: []
      operationId: login
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  continueUrl:
                    type: string
                  toConnect:
                    type: boolean
                  targetUser:
                    nullable: true
                  socialId:
                    type: string
                  socialEmail:
                    type: string
                  socialName:
                    type: string
                  socialImage:
                    type: string
                  googleId:
                    type: string
                  githubId:
                    type: string
                  issuerName:
                    type: string
        '503':
          description: '503'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - APPLICATION_NOT_INSTALLED
                      message:
                        type: string
                        enum:
                          - Application is not installed
                      redirectTo:
                        type: string
                        enum:
                          - /installer
                    required:
                      - code
                      - message
                      - redirectTo
                required:
                  - error
    post:
      summary: Process login
      tags: *ref_0
      parameters: []
      operationId: loginPost
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                loginForm:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 6
                  required:
                    - email
                    - password
                toConnect:
                  type: boolean
              required:
                - loginForm
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {}
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - errors
        '503':
          description: '503'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - APPLICATION_NOT_INSTALLED
                      message:
                        type: string
                        enum:
                          - Application is not installed
                      redirectTo:
                        type: string
                        enum:
                          - /installer
                    required:
                      - code
                      - message
                      - redirectTo
                required:
                  - error
  /register:
