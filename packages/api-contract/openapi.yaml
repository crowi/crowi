                            type: string
                        required:
                          - username
                    codeBlockLanguages:
                      type: array
                      items:
                        type: string
                renderedAst: {}
                rendererVersion:
                  type: string
                parentRevisionId:
                  type:
                    - string
                    - 'null'
                type:
                  type: string
                  enum:
                    - snapshot
                    - incremental
                savedBy:
                  anyOf:
                    - type: string
                    - type: object
                      properties:
                        _id:
                          type: string
                        id:
                          type: string
                        username:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
