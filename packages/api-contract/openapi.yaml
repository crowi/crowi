      parameters: []
      operationId: registerPost
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                registerForm:
                  type: object
                  properties:
                    username:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 6
                    googleId:
                      type: string
                    githubId:
                      type: string
                    socialImage:
                      type: string
                  required:
                    - username
                    - name
                    - email
                    - password
              required:
                - registerForm
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {}
        '400':
          description: '400'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - errors
        '503':
          description: '503'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - APPLICATION_NOT_INSTALLED
                      message:
                        type: string
                        enum:
                          - Application is not installed
                      redirectTo:
                        type: string
                        enum:
                          - /installer
                    required:
                      - code
                      - message
                      - redirectTo
                required:
                  - error
  /login/error/{reason}:
    get:
      summary: Display login error
      tags: *ref_0
      parameters:
        - name: reason
          in: path
          required: true
          schema:
            type: string
            enum:
              - suspended
              - registered
      operationId: loginError
      responses:
        '403':
          description: '403'
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                  reasonMessage:
                    type: string
                required:
                  - reason
                  - reasonMessage
  /installer:
    get:
