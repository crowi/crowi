                      redirectTo:
                        type: string
                        enum:
                          - /installer
                    required:
                      - code
                      - message
                      - redirectTo
                required:
                  - error
  /auth/register:
    post:
      summary: Register new user and receive tokens
      tags: *ref_2
      parameters: []
      operationId: tokenRegister
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
              required:
