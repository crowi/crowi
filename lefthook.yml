# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx}"
      # --no-errors-on-unmatched: when every staged file is biome-ignored
      # (e.g. only generated artifacts like src/generated/openapi.ts, excluded
      # via biome.json `!**/generated/**`), biome would otherwise exit 1 with
      # "No files were processed" and wrongly fail the commit. This silences
      # that case without changing formatting of real files.
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: workspace-protocol
      glob: "**/package.json"
      run: node scripts/check-workspace-protocol.mjs
    - name: publishable-metadata
      glob: "**/package.json"
      run: node scripts/check-package-publishable.mjs
    - name: kebab-filenames
      glob: "**/*.{ts,tsx}"
      run: node scripts/check-kebab-filenames.mjs
    # A changeset naming an ignored package next to a published one fails
    # `changeset version` — the first step of the release job — so the push
    # succeeds, CI goes green, and only the release workflow goes red.
    - name: changeset-ignored-mix
      glob: ".changeset/*.md"
      run: node scripts/check-changeset-ignored-mix.mjs

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    # Full build so a build-only break (e.g. an MDX/Next content error the
    # linter can't see) is caught before it reaches main. Turbo caching keeps
    # this incremental: unchanged packages are cache hits, so only pushes that
    # actually touch a package pay its build cost.
    - name: build
      run: pnpm build
    - name: openapi-fresh
      glob: "packages/api-contract/**"
      run: pnpm check:openapi
    # Re-checked here without a glob because the pre-commit job only fires when
    # a changeset file is staged. Adding a package to `.changeset/config.json`
    # `ignore` can turn an existing, untouched changeset into a mixed one, and
    # that edit alone would never trip the staged-file check.
    - name: changeset-ignored-mix
      run: node scripts/check-changeset-ignored-mix.mjs
    # Second net for .claude/scripts + .claude/skills/*/tests: ci.yml skips a
    # .claude/*.md-only push (see its paths-ignore comment), so claude-md-drift.
    # test.mjs would otherwise never run on such a push. This job is not
    # path-scoped to markdown alone (the pre-push files list mixes code and
    # docs), so it runs whenever anything under .claude/ changed.
    #
    # This does NOT cover a root CLAUDE.md heading rename by itself — CLAUDE.md
    # lives outside .claude/, so this glob never matches it. That case is
    # covered separately by ci.yml's '!CLAUDE.md' paths-ignore negation.
    - name: claude-scripts
      glob: ".claude/**"
      run: pnpm test:scripts && pnpm test:scripts:sh
