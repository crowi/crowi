# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true

# pre-push lint is intentionally not enabled yet.
# Two pre-existing React 19 errors must be resolved first
