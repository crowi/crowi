# Development infrastructure + opt-in application services.
#
# Default (`docker compose up -d`) starts only the dev infra dependencies
# (MongoDB / Redis / Elasticsearch / PlantUML / Mailpit). Run `pnpm dev` on
# the host to start @crowi/api and @crowi/web against this infra.
#
# To bring up the full stack inside Docker (api + web + infra), use the
# `app` profile:
#
#   docker compose --profile app up -d --build
#
# The `app` profile builds the api / web images from `packages/{api,web}/
# Dockerfile`. The api image is built from the `@crowi/runner-app` reference
# runner project (apps/crowi-runner) and bakes that project's
# `crowi.config.json` in. To override driver selection without a rebuild, the
# api service re-mounts `apps/crowi-runner/crowi.config.json` at
# /app/crowi.config.json (operator-controlled).
services:
  mongodb:
    image: mongo:8
    container_name: crowi-mongodb
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - 27017:27017

  # Test-only MongoDB (feature-test-parallel-db-flake-hardening Phase 2 / A2).
  # A full `@crowi/api` jest run opens ~270 connections against one shared
  # mongod (per-file boot connect + teardown connect x ~136 files) and churns
  # create-db/autoIndex/dropDatabase at the same rate; putting that on the
  # SAME server + disk path as the always-on dev `mongodb` service above is a
  # stall-window contributor (see the spec's "発生機序" — VirtioFS bind-mount
  # fsync under churn is the leading hypothesis, not yet proven). Deliberately
  # INDEPENDENT of `mongodb`: separate container, separate host port (27018),
  # tmpfs data dir instead of the bind mount. tmpfs means this container is
  # fully disposable — a restart or `docker compose down` loses all data, and
  # that's fine, since every test only ever writes a per-file scratch database
  # that its own teardown() drops before the file's tests are even reported.
  # `global-setup.js` probes this port FIRST, falling back to `mongodb`
  # (27017) and then to an in-process mongodb-memory-server when neither is
  # reachable — a developer who hasn't pulled this compose change (or hasn't
  # run `docker compose up -d` at all) keeps working exactly as before.
  crowi-test-mongodb:
    image: mongo:8
    container_name: crowi-test-mongodb
    restart: unless-stopped
    tmpfs:
      - /data/db
    ports:
      - 27018:27017

  # Pinned to a reviewed Redis 8.x patch tag (RSALv2/SSPLv1/AGPLv3 licensed;
  # see the operations docs for the license/support policy once
  # feature-redis-8-upgrade Phase 4 lands). Moving tags (`redis:8`,
  # `redis:latest`, and the previous `redis:7`, which itself silently
  # resolved to the same 7.4.x RSALv2/SSPLv1 generation) are deliberately
  # avoided: a moving tag can cross a license/behavior boundary without
  # anyone noticing. Digest pinned alongside the tag for supply-chain
  # reproducibility; bump both together when following a new patch release
  # (feature-redis-8-upgrade Phase 1 — patch cadence is manual, no Dependabot
  # `docker` ecosystem tracking yet).
  redis:
    image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    container_name: crowi-redis
    restart: unless-stopped
    ports:
      - 6379:6379

  # Test-only Redis, plaintext, Config-pub/sub-smoke ONLY
  # (feature-redis-8-upgrade Phase 1/2). `ConfigService.setupPubSub()`
  # subscribes to a single fixed, global 'config' channel
  # (packages/api/src/service/config.ts) — a PUBLISH there makes EVERY
  # process sharing the Redis instance unconditionally run
  # `load()`/`postUpdate()`/`setupMailer()`, including a concurrent
  # worktree's running dev api on the shared `redis` service above. Config
  # smoke therefore needs an instance guaranteed to have no other
  # subscriber, so it runs here instead. Same minimal-config pattern as
  # `crowi-test-mongodb` above (image/container_name/restart/ports only, no
  # tmpfs or other hardening needed — this only ever holds disposable smoke
  # data, never dev data).
  crowi-test-redis:
    image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    container_name: crowi-test-redis
    restart: unless-stopped
    ports:
      - 6380:6379

  # TLS connectivity smoke fixture (feature-redis-8-upgrade Phase 1/2).
  # Reuses the self-signed cert pair added in fee9c9a4
  # (packages/api/src/util/__fixtures__/tls/) rather than adding a new
  # certificate-generation mechanism. TLS-only port — no plaintext port, no
  # ACL. `--tls-auth-clients no` so the server doesn't require a CA
  # certificate to verify client certs; the smoke client connects with
  # `rejectUnauthorized: false` (self-signed, test-only trust — see
  # redis-opts.test.ts), matching the "handshake succeeds, not a strict CA
  # chain" scope documented in the spec. Only the boot/TLS handshake smoke
  # (Phase 2, consumer #8) uses this — Config smoke uses `crowi-test-redis`
  # above instead.
  crowi-test-redis-tls:
    image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    container_name: crowi-test-redis-tls
    restart: unless-stopped
    volumes:
      - ./packages/api/src/util/__fixtures__/tls:/tls:ro
    ports:
      - 6381:6381
    command: >-
      redis-server
      --port 0
      --tls-port 6381
      --tls-cert-file /tls/localhost-cert.pem
      --tls-key-file /tls/localhost-key.pem
      --tls-auth-clients no

  elasticsearch:
    # Custom image: stock 9.4.0 + analysis-kuromoji preinstalled so the
    # `kuromoji` analyzer in the search-plugin admin UI works out of the
    # box. The `sudachi` analyzer is NOT bundled — see elasticsearch.Dockerfile.
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
    image: crowi-elasticsearch:9.4.0
    container_name: crowi-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Dev-only: ES disk watermark blocks indexing when the laptop disk is
      # ~85% full. Disable so a tight disk doesn't surprise developers.
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1

  plantuml:
    image: plantuml/plantuml-server:latest
    container_name: crowi-plantuml
    restart: unless-stopped
    ports:
      - 8080:8080

  # Local mail catcher. Captures everything sent by @crowi/plugin-mail-smtp
  # so you can inspect the rendered email (from / subject / body / headers)
  # without a real SMTP server. Configure the SMTP sender at /admin/plugins
  # with host=localhost, port=1025, no auth; open the inbox at
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: crowi-mailpit
    restart: unless-stopped
    ports:
      - 1025:1025 # SMTP
      - 8025:8025 # Web UI

  # ---------------------------------------------------------------------------
  # Application services (opt-in via `--profile app`)
  # ---------------------------------------------------------------------------
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: crowi-api:dev
    container_name: crowi-api
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    environment:
      # Container-network URIs override host-localhost values from .env.
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/crowi
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:4302
    ports:
      # Host 4301 -> container 3000. 4301 is Crowi's canonical api port
      # (matches `.env.example` PORT and the `pnpm dev` api port).
      - "4301:3000"
    volumes:
      # Operator-controlled plugin config. The image bakes the runner project's
      # crowi.config.json in; this re-mount lets you override driver selection
      # without rebuilding. Points at the runner project's copy.
      - ./apps/crowi-runner/crowi.config.json:/app/crowi.config.json:ro

  web:
    profiles: ["app"]
    # Render-only Next.js server. The image bakes NO absolute API URL: the
    # browser uses relative `/api/v2`,`/files` paths and derives WS URLs from
    # `window.location`. It is NOT exposed directly — the `caddy` front proxy
    # below serves it as one same-origin host so relative HTTP, inline attachment
    # images, the first-party auth cookie and the realtime WebSockets all work.
    # (A standalone `node server.js` cannot runtime-proxy `/api` itself —
    # next.config rewrites are baked at build — so the front proxy is required;
    # see packages/web/Dockerfile and operations/deployment.)
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: crowi-web:dev
    container_name: crowi-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # No host port: reached through `caddy` (single same-origin entrypoint).

  caddy:
    profiles: ["app"]
    # Same-origin front proxy (recommended self-host topology). Routes one
    # origin by path: /api,/files,/collab,/presence,/notifications → api, else
    # → web. Open http://localhost:4302 — everything works same-origin,
    # including realtime WS and authenticated attachment images.
    image: caddy:2
    container_name: crowi-caddy
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Host 4302 -> Caddy :80. 4302 is Crowi's canonical web port (matches the
      # `pnpm dev` web port); the browser hits this single origin.
      - "4302:80"
