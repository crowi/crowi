# Development dependencies only.
# Run `docker compose up -d` to start MongoDB / Redis / Elasticsearch / PlantUML,
# then run `pnpm dev` on the host to start @crowi/api and @crowi/web.
services:
  mongodb:
    image: mongo:8
    container_name: crowi-mongodb
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - 27017:27017

  redis:
    image: redis:7
    container_name: crowi-redis
    restart: unless-stopped
    ports:
      - 6379:6379

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    container_name: crowi-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Dev-only: ES disk watermark blocks indexing when the laptop disk is
      # ~85% full. Disable so a tight disk doesn't surprise developers.
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1

  plantuml:
    image: plantuml/plantuml-server:latest
    container_name: crowi-plantuml
    restart: unless-stopped
    ports:
      - 8080:8080
