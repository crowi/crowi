# Development infrastructure + opt-in application services.
#
# Default (`docker compose up -d`) starts only the dev infra dependencies
# (MongoDB / Redis / Elasticsearch / PlantUML). Run `pnpm dev` on the host
# to start @crowi/api and @crowi/web against this infra.
#
# To bring up the full stack inside Docker (api + web + infra), use the
# `app` profile:
#
#   docker compose --profile app up -d --build
#
# The `app` profile builds the api / web images from `packages/{api,web}/
# Dockerfile`. The api service mounts repo-root `crowi.config.json` at
# /app/crowi.config.json (operator-controlled, not baked into the image).
services:
  mongodb:
    image: mongo:8
    container_name: crowi-mongodb
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - 27017:27017

  redis:
    image: redis:7
    container_name: crowi-redis
    restart: unless-stopped
    ports:
      - 6379:6379

  elasticsearch:
    # Custom image: stock 9.4.0 + analysis-kuromoji preinstalled so the
    # `kuromoji` analyzer in the search-plugin admin UI works out of the
    # box. The `sudachi` analyzer is NOT bundled — see elasticsearch.Dockerfile.
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
    image: crowi-elasticsearch:9.4.0
    container_name: crowi-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Dev-only: ES disk watermark blocks indexing when the laptop disk is
      # ~85% full. Disable so a tight disk doesn't surprise developers.
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1

  plantuml:
    image: plantuml/plantuml-server:latest
    container_name: crowi-plantuml
    restart: unless-stopped
    ports:
      - 8080:8080

  # ---------------------------------------------------------------------------
  # Application services (opt-in via `--profile app`)
  # ---------------------------------------------------------------------------
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: crowi-api:dev
    container_name: crowi-api
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    environment:
      # Container-network URIs override host-localhost values from .env.
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/crowi
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:4302
    ports:
      # Host 4301 -> container 3000. 4301 is Crowi's canonical api port
      # (matches `.env.example` PORT and the `pnpm dev` api port).
      - "4301:3000"
    volumes:
      # Operator-controlled plugin config — mount, do not bake into the image.
      - ./crowi.config.json:/app/crowi.config.json:ro

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Web container talks to the api container over the compose network.
        NEXT_PUBLIC_API_URL: http://api:3000
    image: crowi-web:dev
    container_name: crowi-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://api:3000
    ports:
      # Host 4302 -> container 3000. 4302 is Crowi's canonical web port
      # (matches the `pnpm dev` web port).
      - "4302:3000"
