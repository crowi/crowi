# Development dependencies only.
# Run `docker compose up -d` to start MongoDB / Redis / Elasticsearch / PlantUML,
# then run `pnpm dev` on the host to start @crowi/api and @crowi/web.
services:
  mongodb:
    image: mongo:8
    container_name: crowi-mongodb
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - 27017:27017

  redis:
    image: redis:7
    container_name: crowi-redis
    restart: unless-stopped
    ports:
      - 6379:6379

  # elasticsearch is intentionally omitted for now.
  # The 7.4.0 image cannot read existing 7.14.1 data, and @elastic/elasticsearch
  # is no longer in package.json — search is effectively disabled in Crowi 2.0 dev.
  # Re-add this service when search is brought back, with a current ES version.

  plantuml:
    image: plantuml/plantuml-server:latest
    container_name: crowi-plantuml
    restart: unless-stopped
    ports:
      - 8080:8080
